<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Logo Uguali nelle Diversità: quattro mani di colori diversi unite a formare un cuore">
  <title>Uguali nelle Diversità</title>
  <!--
    Ricostruzione vettoriale fedele del logo (segnaposto).
    Quattro cuori con contorno rosso a girandola; dentro ciascuno una mano di
    un diverso tono della pelle, con le pieghe delle dita. Per il marchio
    ufficiale: salvare il file in public/logo.png e impostare DATI.logo='/logo.png'.
  -->
  <defs>
    <!-- Cuore con punta al centro (200,200) e lobi verso l'alto -->
    <path id="uds-heart" d="M200,200 C168,150 128,142 128,102 C128,72 164,64 184,86 C191,94 196,102 200,110 C204,102 209,94 216,86 C236,64 272,72 272,102 C272,142 232,150 200,200 Z"/>
    <!-- Mano (palmo + 4 dita unite + pollice), rivolta verso l'alto -->
    <g id="uds-hand">
      <rect x="166" y="116" width="68" height="56" rx="22"/>
      <rect x="167" y="84"  width="19" height="54" rx="9.5"/>
      <rect x="184" y="76"  width="19" height="62" rx="9.5"/>
      <rect x="201" y="82"  width="19" height="56" rx="9.5"/>
      <rect x="217" y="92"  width="18" height="48" rx="9"/>
      <rect x="147" y="132" width="16" height="44" rx="8" transform="rotate(42 155 154)"/>
    </g>
    <!-- Pieghe tra le dita -->
    <g id="uds-creases" fill="none" stroke-linecap="round" stroke-width="3.6">
      <line x1="185" y1="100" x2="185" y2="132"/>
      <line x1="202" y1="98"  x2="202" y2="132"/>
      <line x1="218" y1="104" x2="218" y2="132"/>
    </g>
  </defs>

  <!-- Mano in alto: marrone -->
  <g transform="rotate(0 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="12" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#7A4A24"/>
    <use href="#uds-creases" stroke="#5A3318"/>
  </g>
  <!-- Mano a destra: scura -->
  <g transform="rotate(90 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="12" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#1C1C1C"/>
    <use href="#uds-creases" stroke="#4A4A4A"/>
  </g>
  <!-- Mano in basso: dorata -->
  <g transform="rotate(180 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="12" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#F4B43C"/>
    <use href="#uds-creases" stroke="#D8922A"/>
  </g>
  <!-- Mano a sinistra: chiara -->
  <g transform="rotate(270 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="12" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#F6DCC4"/>
    <use href="#uds-creases" stroke="#E0B999"/>
  </g>
</svg>
