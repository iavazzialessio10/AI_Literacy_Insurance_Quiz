<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Logo Uguali nelle Diversità: quattro mani di colori diversi unite a formare un cuore">
  <title>Uguali nelle Diversità</title>
  <!--
    Ricostruzione vettoriale fedele del logo (segnaposto).
    Quattro cuori con contorno rosso disposti a girandola; dentro ciascuno una
    mano di un diverso tono della pelle. Per il marchio ufficiale, sostituire
    con il PNG: salvare il file in public/logo.png e impostare DATI.logo = '/logo.png'.
  -->
  <defs>
    <!-- Cuore con punta al centro (200,200) e lobi verso l'alto -->
    <path id="uds-heart" d="M200,200 C168,150 128,142 128,102 C128,72 164,64 184,86 C191,94 196,102 200,110 C204,102 209,94 216,86 C236,64 272,72 272,102 C272,142 232,150 200,200 Z"/>
    <!-- Mano stilizzata (palmo + 4 dita + pollice) rivolta verso l'alto -->
    <g id="uds-hand">
      <rect x="167" y="118" width="66" height="54" rx="20"/>
      <rect x="171" y="84"  width="14" height="52" rx="7"/>
      <rect x="188" y="76"  width="14" height="60" rx="7"/>
      <rect x="205" y="82"  width="14" height="54" rx="7"/>
      <rect x="221" y="94"  width="13" height="44" rx="6.5"/>
      <rect x="149" y="134" width="13" height="42" rx="6.5" transform="rotate(40 155 155)"/>
    </g>
  </defs>

  <!-- Mano in alto: marrone -->
  <g transform="rotate(0 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="11" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#7A4A24"/>
  </g>
  <!-- Mano a destra: scura -->
  <g transform="rotate(90 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="11" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#1C1C1C"/>
  </g>
  <!-- Mano in basso: dorata -->
  <g transform="rotate(180 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="11" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#F4B43C"/>
  </g>
  <!-- Mano a sinistra: chiara -->
  <g transform="rotate(270 200 200)">
    <use href="#uds-heart" fill="#ffffff" stroke="#E8392B" stroke-width="11" stroke-linejoin="round"/>
    <use href="#uds-hand" fill="#F6DCC4"/>
  </g>
</svg>
